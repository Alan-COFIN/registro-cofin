<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro COFIN</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>Registro COFIN</h1>
  <span id="sync-status" class="sync-status sync-ok">Iniciando...</span>
</header>

<nav class="tabs">
  <button class="tab active" onclick="UI.showTab('registro', this)">Novo registro</button>
  <button class="tab" onclick="UI.showTab('historico', this)">Histórico</button>
  <button class="tab" onclick="UI.showTab('config', this)">Configurações</button>
  <button class="tab" onclick="UI.showTab('pit', this)">Planejar PIT</button>
  <button class="tab" onclick="UI.showTab('relatorio', this)">Relatório</button>
</nav>

<main>

  <!-- ============ ABA: NOVO REGISTRO ============ -->
  <section id="registro" class="section active">
    <div class="card">
      <div class="row">
        <div class="field">
          <label>Processo SEI</label>
          <input type="text" id="sei" placeholder="Ex: 23244.004463/2024-69" oninput="Registro.onSeiInput()">
          <div id="sei-sugestao"></div>
        </div>
        <div class="field">
          <label>Data</label>
          <input type="date" id="data">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Campus / Setor</label>
          <select id="campus"></select>
        </div>
        <div class="field">
          <label>Responsável pela atividade</label>
          <select id="responsavel"></select>
        </div>
      </div>

      <div class="field">
        <label>Tipo de demanda</label>
        <select id="tipo" onchange="Registro.onTipoChange()"></select>
      </div>

      <div class="field" id="ativs-field" style="display:none">
        <label>Atividades realizadas</label>
        <div class="atividades-box" id="ativs-list"></div>
      </div>

      <div class="field">
        <label>Detalhes (opcional)</label>
        <textarea id="detalhes" placeholder="Ex: Despacho COFIN SEI n. 1304283, NP163..."></textarea>
      </div>

      <button class="btn-pri" onclick="Registro.salvar()">Salvar registro</button>
    </div>
  </section>

  <!-- ============ ABA: HISTÓRICO ============ -->
  <section id="historico" class="section">
    <div class="card">
      <div class="row">
        <div class="field"><label>De</label><input type="date" id="f-de" onchange="Historico.render()"></div>
        <div class="field"><label>Até</label><input type="date" id="f-ate" onchange="Historico.render()"></div>
        <div class="field"><label>Tipo</label><select id="f-tipo" onchange="Historico.render()"></select></div>
        <div class="field"><label>Responsável</label><select id="f-responsavel" onchange="Historico.render()"></select></div>
      </div>
      <div id="resumo-responsavel"></div>
    </div>
    <div id="lista-registros"></div>
  </section>

  <!-- ============ ABA: CONFIGURAÇÕES ============ -->
  <section id="config" class="section">
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center">
        <strong>Tipos de demanda e atividades</strong>
        <div style="display:flex;gap:8px">
          <button class="btn-sec" onclick="UI.addTipo()">+ novo tipo</button>
          <button class="btn-sec" onclick="Sync.sincronizarConfig({force:false})">Puxar da nuvem</button>
          <button class="btn-sec" onclick="Sync.sincronizarConfig({force:true})">Forçar puxar</button>
        </div>
      </div>
    </div>
    <div id="config-lista"></div>
  </section>

  <!-- ============ ABA: PLANEJAR PIT ============ -->
  <section id="pit" class="section">
    <div class="card">
      <div class="field">
        <label>Horas totais disponíveis no período</label>
        <input type="number" id="pit-total" min="1" oninput="Pit.calcular()">
      </div>
      <div id="pit-resumo" class="card" style="background:#f9f9f9"></div>
      <div id="pit-alerta" style="display:none;padding:10px;border-radius:8px;background:#fff3e0;color:#e65100;margin-top:8px"></div>
    </div>
    <div class="card">
      <div id="pit-lista"></div>
      <button class="btn-sec" onclick="Pit.adicionar()">+ entrega</button>
    </div>
  </section>

  <!-- ============ ABA: RELATÓRIO ============ -->
  <section id="relatorio" class="section">
    <div class="card">
      <div class="row">
        <div class="field"><label>Mês</label><input type="month" id="rel-mes"></div>
      </div>
      <button class="btn-pri" onclick="Relatorio.gerar()">Gerar relatório (RIT)</button>
    </div>
    <div id="rel-cards" class="card" style="display:none">
      <pre id="rel-texto"></pre>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn-sec" onclick="Relatorio.copiar()">Copiar</button>
        <button class="btn-sec" onclick="Relatorio.baixarTxt()">Baixar .txt</button>
      </div>
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/sei.js"></script>
<script src="js/sync.js"></script>
<script src="js/ui.js"></script>
<script src="js/registro.js"></script>
<script src="js/historico.js"></script>
<script src="js/relatorio.js"></script>
<script src="js/pit.js"></script>
<script src="js/main.js"></script>
</body>
</html>
